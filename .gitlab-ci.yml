# GitLab CI/CD Rules Manifest Gate
stages:
  - test

rules-gate:
  stage: test
  image: python:3.11-slim
  before_script:
    - apt-get update && apt-get install -y bash git perl
    - pip install pyyaml jsonschema --quiet
  script:
    - bash agent-kit/scripts/run-rules-manifest.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
