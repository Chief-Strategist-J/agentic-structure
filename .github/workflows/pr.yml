name: PR Verification Gates

on:
  pull_request:
    branches: [main]

jobs:
  rules-check:
    name: Rules Manifest Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml jsonschema --quiet
      - name: Run Rules Manifest Checks
        run: bash agent-kit/scripts/run-rules-manifest.sh
